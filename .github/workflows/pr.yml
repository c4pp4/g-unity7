## Check that the patches of all packages still apply and that the source
##  packages can be built, without uploading anything.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

## The default shell of container jobs is sh.
defaults:
  run:
    shell: bash

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          source scripts/lib.sh
          # Packages with HOLD in package.sh are not checked
          for pkg in $(list_packages); do
            load_package "$pkg"
            if [ -n "${HOLD:-}" ]; then
              echo "::notice::$pkg is held: $HOLD" >&2
              continue
            fi
            echo "$pkg"
          done > packages.txt
          echo "packages=$(python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))' < packages.txt)" >> "$GITHUB_OUTPUT"

  check:
    needs: list
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.list.outputs.packages) }}
    env:
      DEBEMAIL: ${{ vars.DEBEMAIL || 'noreply@example.invalid' }}
      DEBFULLNAME: ${{ vars.DEBFULLNAME || 'c4pp4' }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: scripts/build-source.sh --force ${{ matrix.package }}
      - if: always()
        run: |
          for summary in build/*/${{ matrix.package }}/review/summary.md; do
            [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          done
          true
