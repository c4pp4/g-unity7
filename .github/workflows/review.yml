## The approval issue: update it (the cron asks for every hour, GitHub runs it
##  a few times a day) and run the commands that the repository owner gives in
##  its comments (/upload, /reject, /promote, /retry, /ported).
name: Review

on:
  schedule:
    - cron: '41 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: Command as in an issue comment (empty to only update the issue)
        required: false
        default: ''

permissions:
  contents: read

## apt-get update is tried again after a minute: it fails while the Ubuntu
##  mirror syncs. The actions are pinned to the commits of their versions.
## The default shell of container jobs is sh.
defaults:
  run:
    shell: bash

jobs:
  ## Updating the issue needs neither the signing key nor the Launchpad
  ##  credentials, so it runs outside the launchpad environment
  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.command == '')
    ## One at a time with the command job and the upload job of ppa.yml, which
    ##  also rewrite the approval issue; queue: max keeps all waiting runs and
    ##  their commands.
    concurrency:
      group: approve
      queue: max
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    permissions:
      contents: read
      issues: write
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          overlay-fetch-depth: 0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/approve.py refresh

  command:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.command != '') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.issue.labels.*.name, 'approve') &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, '/'))
    concurrency:
      group: approve
      queue: max
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    environment: launchpad
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      DEBEMAIL: ${{ vars.DEBEMAIL }}
      DEBFULLNAME: ${{ vars.DEBFULLNAME }}
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          overlay-fetch-depth: 0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
          COMMAND: ${{ github.event.comment.body || inputs.command }}
        run: |
          export LP_CREDENTIALS_FILE=$(mktemp)
          trap 'rm -f "$LP_CREDENTIALS_FILE"' EXIT
          printf '%s\n' "$LP_CREDENTIALS" > "$LP_CREDENTIALS_FILE"
          scripts/approve.py comment "$COMMAND"
