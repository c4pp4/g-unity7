## Check that the patches still apply and that the source packages can be
##  built, without uploading anything: for a push or a pull request, only the
##  packages whose directory changed, or all of them when something that every
##  build uses changed, and all of them every week.
name: Check

## A change of the README alone does not need the source packages.
on:
  push:
    paths-ignore:
      - README.md
  pull_request:
    paths-ignore:
      - README.md
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

## apt-get update is tried again after a minute: it fails while the Ubuntu
##  mirror syncs. The actions are pinned to the commits of their versions.
## The default shell of container jobs is sh.
defaults:
  run:
    shell: bash

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: list
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          source scripts/lib.sh
          case $EVENT in
            push) since=$BEFORE ;;
            pull_request) since=$BASE ;;
            *) since= ;;
          esac
          # All packages when the changes are not known (the weekly run, a new
          #  branch) or when a file that every build uses changed
          all=1
          declare -A changed=()
          if [ -n "$since" ] && git cat-file -e "$since^{commit}" 2>/dev/null; then
            all=
            while read -r file; do
              case $file in
                packages/*/*|local/*/*) dir=${file#*/}; changed[${dir%%/*}]=1 ;;
                scripts/*|config.sh|branding/*|Containerfile|.github/actions/*|.github/workflows/pr.yml) all=1 ;;
              esac
            done < <(git diff --name-only "$since" HEAD)
          fi
          # Packages with HOLD in package.sh are not checked
          for pkg in $(list_packages); do
            [ -n "$all" ] || [ -n "${changed[$pkg]:-}" ] || continue
            load_package "$pkg"
            if [ -n "${HOLD:-}" ]; then
              echo "::notice::$pkg is held: $HOLD" >&2
              continue
            fi
            echo "$pkg"
          done > packages.txt
          echo "packages=$(python3 -c 'import json, sys; print(json.dumps(sys.stdin.read().split()))' < packages.txt)" >> "$GITHUB_OUTPUT"

  check:
    needs: list
    if: needs.list.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.list.outputs.packages) }}
    env:
      DEBEMAIL: ${{ vars.DEBEMAIL || 'noreply@example.invalid' }}
      DEBFULLNAME: ${{ vars.DEBFULLNAME || 'c4pp4' }}
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/build-source.sh --force ${{ matrix.package }}
      - if: always()
        run: |
          for summary in build/*/${{ matrix.package }}/review/summary.md; do
            [ -f "$summary" ] && cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          done
          true
      # The job log has only the end of a failed build
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-${{ matrix.package }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/*/${{ matrix.package }}/work/dpkg-buildpackage.log
