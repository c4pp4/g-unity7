## Test g-unity7-cleanup and the apt configuration of g-unity7-apt-pin with
##  dummy packages in Ubuntu containers (tests/cleanup), test lp.py, approve.py
##  and plan.sh (tests/scripts), and check the shell and Python scripts and the
##  workflows for errors.
name: Tests

on:
  push:
    paths:
      - '**.sh'
      - 'scripts/**'
      - 'local/g-unity7-meta/**'
      - 'local/g-unity7-apt-pin/**'
      - 'tests/**'
      - '.github/**'
  pull_request:
    paths:
      - '**.sh'
      - 'scripts/**'
      - 'local/g-unity7-meta/**'
      - 'local/g-unity7-apt-pin/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

## apt-get update is tried again after a minute: it fails while the Ubuntu
##  mirror syncs. The actions are pinned to the commits of their versions.
## The default shell of container jobs is sh.
defaults:
  run:
    shell: bash

jobs:
  cleanup:
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    strategy:
      fail-fast: false
      matrix:
        group: [alternatives, mozilla, copies, locations, links, snaps, pin]
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/cleanup/test.sh ${{ matrix.group }}

  scripts:
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates python3 python3-pyflakes >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests/scripts -v
      - run: python3 -m pyflakes scripts tests/scripts

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Errors only: the warnings are about the variables of package.sh, which
      #  build-source.sh uses, and other intended code
      - run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          git ls-files -z '*.sh' local/g-unity7-meta/g-unity7-cleanup local/g-unity7-meta/copy-snap-profiles \
            | xargs -0 shellcheck -S error -s bash

  ## GitHub expressions, job dependencies and contexts of the workflows.
  ##  shellcheck runs in the job above. actionlint does not know queue in
  ##  concurrency yet.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP"/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP"/actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP"/actionlint -color -shellcheck= -ignore 'unexpected key "queue" for "concurrency" section'
