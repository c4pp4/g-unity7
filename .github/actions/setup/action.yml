name: Setup
description: >-
  Check out the overlay at the series commit and install the build
  dependencies in the Ubuntu container. The repository is already checked out.
outputs:
  series:
    description: The series to build
    value: ${{ steps.config.outputs.series }}
runs:
  using: composite
  steps:
    - id: config
      shell: bash
      run: |
        source config.sh
        echo "series=${SERIES[0]}" >> "$GITHUB_OUTPUT"
        echo "overlay_ref=${OVERLAY_REF[${SERIES[0]}]}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: c4pp4/gentoo-unity7
        ref: ${{ steps.config.outputs.overlay_ref }}
        path: overlay
    - shell: bash
      run: |
        export DEBIAN_FRONTEND=noninteractive
        # apt-get update fails while the Ubuntu mirror syncs
        for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
        apt-get install -y -qq --no-install-recommends $(cat scripts/deps.txt) >/dev/null
        echo "OVERLAY_DIR=$PWD/overlay" >> "$GITHUB_ENV"
