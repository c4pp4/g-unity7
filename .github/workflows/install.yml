## Install Ubuntu Unity, then g-unity7-desktop from the staging PPA and the
##  main PPA, and run g-unity7-cleanup --yes, for real in a container once a
##  week (tests/staging/install.sh). The apt simulation of ppa.yml finds no
##  file conflicts and no errors of the maintainer scripts.
name: Install

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ppa: [staging, main]
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/staging/install.sh ${{ matrix.ppa }}
