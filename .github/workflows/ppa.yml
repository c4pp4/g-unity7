## Build the source packages whose Ubuntu version or input changed. Upload
##  those with unchanged patches to the staging PPA, and add the others to the
##  approval issue for review (/upload). With the repository variable
##  STAGING_FROZEN, all of them wait for review, such as during the test before
##  a promotion. Then check that g-unity7-desktop installs from staging as
##  intended. GitHub starts the scheduled runs hours late, so there are two.
name: PPA

on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: Packages separated by spaces (empty for all changed packages)
        required: false
        default: ''
      force:
        description: Build even if unchanged
        type: boolean
        default: false

## queue: max keeps all waiting runs; by default, a new run would cancel the
##  waiting one, such as a manual run with force.
concurrency:
  group: ppa
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

## apt-get update is tried again after a minute: it fails while the Ubuntu
##  mirror syncs. The actions are pinned to the commits of their versions.
## The default shell of container jobs is sh.
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    permissions:
      contents: read
      issues: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      result: ${{ steps.plan.outputs.result }}
      record: ${{ steps.plan.outputs.record }}
      series: ${{ steps.setup.outputs.series }}
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGES: ${{ inputs.packages }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          scripts/approve.py state > state.json
          # An assignment fails the step when plan.sh fails, an echo argument does not.
          #  plan.sh fails only when no package could be checked.
          packages=$(scripts/plan.sh $FORCE --state state.json --errors plan.json $PACKAGES)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "result=$(cat plan.json)" >> "$GITHUB_OUTPUT"
          # The upload job also runs without builds to show the packages that
          #  could not be checked in the issue, or to drop them once they can be
          record=$(python3 -I -c '
          import json
          plan, state = json.load(open("plan.json")), json.load(open("state.json"))
          known = state.get("plan_errors", {})
          print("true" if plan["errors"] or any(n in known for n in plan["checked"]) else "false")')
          echo "record=$record" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      DEBEMAIL: ${{ vars.DEBEMAIL }}
      DEBFULLNAME: ${{ vars.DEBFULLNAME }}
      BUILD: build/${{ needs.plan.outputs.series }}/${{ matrix.package }}
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: scripts/build-source.sh ${{ inputs.force && '--force' || '' }} ${{ matrix.package }}
      - if: always()
        run: |
          [ -f "$BUILD"/review/summary.md ] && cat "$BUILD"/review/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ matrix.package }}
          retention-days: 30
          path: |
            ${{ env.BUILD }}/out
            ${{ env.BUILD }}/review
            ${{ env.BUILD }}/result.env
            ${{ env.BUILD }}/patches.txt
      # The job log has only the end of a failed build
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-${{ matrix.package }}
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ env.BUILD }}/work/dpkg-buildpackage.log

  upload:
    needs: [plan, build]
    ## !cancelled(): a cancelled run uploads nothing (always() would run it)
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result != 'skipped' || needs.plan.outputs.record == 'true') }}
    ## This job and review.yml both rewrite the approval issue after minutes of
    ##  Launchpad queries, so they run one at a time, or one would drop the
    ##  changes of the other. queue: max keeps all waiting runs; by default, a
    ##  new run would cancel the waiting one, and with it a command.
    concurrency:
      group: approve
      queue: max
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    environment: launchpad
    permissions:
      contents: read
      issues: write
      actions: read
    env:
      DEBEMAIL: ${{ vars.DEBEMAIL }}
      DEBFULLNAME: ${{ vars.DEBFULLNAME }}
      GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
      SERIES: ${{ needs.plan.outputs.series }}
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          overlay-fetch-depth: 0
      - if: needs.build.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: source-*
          path: artifacts
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PLANNED: ${{ needs.plan.outputs.packages }}
          PLAN_RESULT: ${{ needs.plan.outputs.result }}
          STAGING_FROZEN: ${{ vars.STAGING_FROZEN }}
        run: |
          # A single artifact is extracted into artifacts/ itself, not into
          #  artifacts/source-<package>/
          if [ -f artifacts/result.env ]; then
            pkg=$(sed -n 's/^PACKAGE=//p' artifacts/result.env)
            [ -n "$pkg" ] || { echo "artifacts/result.env has no PACKAGE" >&2; exit 1; }
            mkdir artifacts/source-"$pkg"
            find artifacts -mindepth 1 -maxdepth 1 ! -name source-"$pkg" -exec mv -t artifacts/source-"$pkg" {} +
          fi
          review=()
          uploaded=()
          failed=
          for dir in artifacts/source-*; do
            [ -d "$dir" ] || continue
            pkg=${dir#artifacts/source-}
            mkdir -p build/"$SERIES"
            mv "$dir" build/"$SERIES"/"$pkg"
            # result.env comes from another job: read its values, do not run it
            result=build/"$SERIES"/"$pkg"/result.env
            status=$(sed -n 's/^STATUS=//p' "$result")
            needs_review=$(sed -n 's/^NEEDS_REVIEW=//p' "$result")
            # Remember an up-to-date result, so that plan.sh does not build it again
            if [ "$status" = uptodate ]; then
              review+=( build/"$SERIES"/"$pkg" )
              continue
            fi
            [ "$status" = built ] || continue
            if [ -n "$needs_review" ] || [ -n "$STAGING_FROZEN" ]; then
              review+=( build/"$SERIES"/"$pkg" )
            else
              if scripts/upload.sh "$pkg"; then
                uploaded+=( --uploaded build/"$SERIES"/"$pkg" )
              else
                failed=1
              fi
              # Launchpad refuses uploads that follow each other closely
              sleep 60
            fi
          done
          # Also shows the planned packages whose build failed, and those that
          #  plan.sh could not check, in the issue
          scripts/approve.py add-review --run-id "$GITHUB_RUN_ID" --planned "$PLANNED" \
            --plan "$PLAN_RESULT" "${uploaded[@]}" "${review[@]}"
          [ -z "$failed" ]

  ## g-unity7-desktop must install from staging, and from the main PPA once it
  ##  has it, without PulseAudio or build tools, and with the G Unity⁷ versions
  ##  of the packages in the PPA
  staging:
    needs: [plan, upload]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: ubuntu:26.10
    strategy:
      fail-fast: false
      matrix:
        ppa: [staging, main]
    steps:
      - run: |
          for i in 1 2 3; do apt-get update -qq && break; [ "$i" -lt 3 ] || exit 1; sleep 60; done
          apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/staging/check.sh ${{ matrix.ppa }}
